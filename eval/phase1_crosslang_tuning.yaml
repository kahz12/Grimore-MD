version: 2
set: tuning
corpus_version: phase0-test-vault-2026-09-22
# Tuning cases for cross-language and multi-document retrieval. The Phase-0
# tuning set asks every question in its note's language and never across two
# notes, so it cannot exercise either failure. Never reuse a fact or note pair
# from eval/phase0_evaluation.yaml here: that set stays held out.
questions:
- id: xl-es-kotlin-jetbrains
  question: ¿Qué empresa diseñó el lenguaje Kotlin y qué máquina virtual tiene como objetivo principal?
  expected_sources:
  - Kotlin Fundamentals
  expected_keywords:
  - JetBrains
  - JVM
  expected_answer: Lo diseñó JetBrains y apunta principalmente a la Java Virtual Machine (JVM).
  expected_evidence:
  - source: Kotlin Fundamentals
    passage: Kotlin is a modern, cross-platform, statically typed programming language designed by JetBrains. Primarily targeting the Java Virtual Machine (JVM)
    locator: Kotlin Fundamentals
  review_criteria: 'Debe comunicar correctamente: JetBrains y la JVM.'
  category: cross-language
  language: es
  case_type: direct
  document_formats:
  - md
  user_task: find-fact
  difficulty: long-document
  split: tuning
